name: Update ArtCraft tools

on:
  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-craft:
    name: Update Craft tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run install
        run: bun install --frozen-lockfile

      - name: Update all craft tools
        run: bun scripts/update-craft.ts

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public vendor
          if git diff --cached --quiet; then
            echo "No updates, nothing to commit."
            exit 0
          fi

          git switch -c update-artcraft-tools
          git commit -m "bump artcraft tools"
          git push -f origin update-artcraft-tools

          if [ -z "$(gh pr list --head update-artcraft-tools --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head update-artcraft-tools --base main --title "chore(deps): bump artcraft tools" --body "Automated update of the vendored ArtCraft web builds."
          fi
