<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>DeckCraft</title>
  
<script type="module">
import init, * as bindings from './deckcraft-web-f413cd376cc2a98b.js';

// The gzipped wasm is not bundled; it is vendored under /vendor/deckcraft-web and downloaded from jsDelivr.
const WASM_GZ_URL = 'https://cdn.jsdelivr.net/gh/ducng99/tools@main/vendor/deckcraft-web/deckcraft-web-f413cd376cc2a98b_bg.wasm.gz';

try {
  const gz = await fetch(WASM_GZ_URL);
  if (!gz.ok) throw new Error(`HTTP ${gz.status} fetching wasm`);
  const wasmStream = gz.body.pipeThrough(new DecompressionStream('gzip'));
  const wasmResponse = new Response(wasmStream, { headers: { 'Content-Type': 'application/wasm' } });
  const wasm = await init({ module_or_path: wasmResponse });

  window.wasmBindings = bindings;

  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
} catch (err) {
  document.getElementById('deckcraft_loading').textContent = `Failed to load DeckCraft: ${err}`;
  throw err;
}
</script>
    <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #deckcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #deckcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="./deckcraft-web-f413cd376cc2a98b.js" crossorigin="anonymous" integrity="sha384-qk+8oC+pD1k8or0rMusflmGPWnsM3FUN0IuM3b4wxqnSTW0Ln5lMqTXFVZHON9m1"></head>
<body>
  <canvas id="deckcraft_canvas"></canvas>
  <div id="deckcraft_loading">Loading DeckCraft&hellip;</div>
</body>
</html>
