<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>DeckCraft</title>
  
<script type="module">
import init, * as bindings from 'https://artcraft-tools-wasm.buckets.tomng.dev/deckcraft-web/0.15.0/deckcraft-web-fe3347a36095bb06.js';

// The wasm is not bundled; it is downloaded from the R2 bucket.
const WASM_URL = 'https://artcraft-tools-wasm.buckets.tomng.dev/deckcraft-web/0.15.0/deckcraft-web-fe3347a36095bb06_bg.wasm';

try {
  const wasm = await init({ module_or_path: WASM_URL });

  window.wasmBindings = bindings;

  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
} catch (err) {
  document.getElementById('deckcraft_loading').textContent = `Failed to load DeckCraft: ${err}`;
  throw err;
}
</script>

    #deckcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
