<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PdfCraft</title>
    
<script type="module">
import init, * as bindings from './pdfcraft-web-3011a456ef82ee06.js';

// The gzipped wasm is not bundled; it is vendored under /vendor/pdfcraft-web and downloaded from jsDelivr.
const WASM_GZ_URL = 'https://cdn.jsdelivr.net/gh/ducng99/tools@main/vendor/pdfcraft-web/pdfcraft-web-3011a456ef82ee06_bg.wasm.gz';

try {
  const gz = await fetch(WASM_GZ_URL);
  if (!gz.ok) throw new Error(`HTTP ${gz.status} fetching wasm`);
  const wasmStream = gz.body.pipeThrough(new DecompressionStream('gzip'));
  const wasmResponse = new Response(wasmStream, { headers: { 'Content-Type': 'application/wasm' } });
  const wasm = await init({ module_or_path: wasmResponse });

  window.wasmBindings = bindings;

  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
} catch (err) {
  console.error(err);
  throw err;
}
</script>

      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
