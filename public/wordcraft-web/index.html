<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft</title>
    
<script type="module">
import init, * as bindings from 'https://artcraft-tools-wasm.buckets.tomng.dev/wordcraft-web/0.17.0/wordcraft-web-d5f8e062bd3e686e.js';

// The wasm is not bundled; it is downloaded from the R2 bucket.
const WASM_URL = 'https://artcraft-tools-wasm.buckets.tomng.dev/wordcraft-web/0.17.0/wordcraft-web-d5f8e062bd3e686e_bg.wasm';

try {
  const wasm = await init({ module_or_path: WASM_URL });

  window.wasmBindings = bindings;

  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
} catch (err) {
  document.getElementById('wordcraft_loading').textContent = `Failed to load WordCraft: ${err}`;
  throw err;
}
</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="https://artcraft-tools-wasm.buckets.tomng.dev/wordcraft-web/0.17.0/wordcraft-web-d5f8e062bd3e686e.js" crossorigin="anonymous" integrity="sha384-fH6DlxObGvoOHHoahHymkiQpSnJsoDeHsn+yvKSRarNNBvSVFypGn50hXzibGLZL"><link rel="modulepreload" href="https://artcraft-tools-wasm.buckets.tomng.dev/wordcraft-web/0.17.0/snippets/eframe-d31a8450ea12dfc1/inline0.js" crossorigin="anonymous" integrity="sha384-uPZQ72BwgZ4v7Km6+UIFbkDDlt7ShGEsAVEHVN/+wZSGFhItJZB83iKMFQXauTSs"></head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Loading WordCraft&hellip;</div>
</body>
</html>
