<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridCraft</title>
    
<script type="module">
import init, * as bindings from './gridcraft-web-f3f8c58ab634d6ba.js';

// The gzipped wasm is not bundled; it is downloaded from the R2 bucket.
const WASM_GZ_URL = 'https://artcraft-tools-wasm.buckets.tomng.dev/gridcraft-web/0.12.1/gridcraft-web-f3f8c58ab634d6ba_bg.wasm.gz';

try {
  const gz = await fetch(WASM_GZ_URL);
  if (!gz.ok) throw new Error(`HTTP ${gz.status} fetching wasm`);
  const wasmStream = gz.body.pipeThrough(new DecompressionStream('gzip'));
  const wasmResponse = new Response(wasmStream, { headers: { 'Content-Type': 'application/wasm' } });
  const wasm = await init({ module_or_path: wasmResponse });

  window.wasmBindings = bindings;

  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
} catch (err) {
  document.getElementById('gridcraft_loading').textContent = `Failed to load GridCraft: ${err}`;
  throw err;
}
</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f3f3; }
    #gridcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #gridcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="./gridcraft-web-f3f8c58ab634d6ba.js" crossorigin="anonymous" integrity="sha384-S2CReIDDicuJh1T0rdBXnwvrOoSBqt0f7S4oQdaRC97x9So5v+swTq2VyVGbDZCH"></head>
<body>
  <canvas id="gridcraft_canvas"></canvas>
  <div id="gridcraft_loading">Loading GridCraft&hellip;</div>
</body>
</html>
