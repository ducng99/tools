<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LightCraft</title>
    <meta name="description" content="LightCraft: open-source photo library and raw developer, running in your browser (WASM).">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1c; }
    canvas#lightcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #lightcraft_loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #b8b8b8; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none;
    }
    #lightcraft_status { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="lightcraft_canvas"></canvas>
  <div id="lightcraft_loading">Loading LightCraft…</div>
  <div id="lightcraft_status" aria-live="polite"></div>
  <script type="module">
import init, { start, command } from "https://artcraft-tools-wasm.buckets.tomng.dev/lightcraft-web/0.21.1/lightcraft_web.js";
(async () => {
  // The Chinese font is a separate file: embedding it would exceed the host's WASM size limit.
  // Like the wasm, the font is downloaded from the R2 bucket.
  const FONT_URL = 'https://artcraft-tools-wasm.buckets.tomng.dev/lightcraft-web/0.21.1/lightcraft_zh_hans.otf';
  const chineseFont = fetch(FONT_URL).then(async response => {
    if (!response.ok) throw new Error(`HTTP ${response.status} fetching font`);
    return new Uint8Array(await response.arrayBuffer());
  });

  // The wasm is not bundled; it is downloaded from the R2 bucket.
  const WASM_URL = 'https://artcraft-tools-wasm.buckets.tomng.dev/lightcraft-web/0.21.1/lightcraft_web_bg.wasm';
  // Compile once; the render workers (worker.js) instantiate the same compiled module.
  const [module, font] = await Promise.all([
    WebAssembly.compileStreaming(fetch(WASM_URL)),
    chineseFont,
  ]);
  globalThis.lightcraftModule = module;
  await init({ module_or_path: module });
  // automation: `await lightcraft.command("library.info", "{}")` → JSON text
  globalThis.lightcraft = { command };
  start(font);
})().catch((e) => {
  console.error(e);
  const el = document.getElementById("lightcraft_loading");
  if (el) el.textContent = "LightCraft failed to load: " + e;
});
</script>
</body>
</html>
